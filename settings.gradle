pluginManagement {
	repositories {
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
		maven { name = 'KikuGie'; url = 'https://maven.kikugie.dev/releases' }
		mavenCentral()
		gradlePluginPortal()
	}
	plugins {
		id 'net.fabricmc.fabric-loom' version "${loom_version}"
		id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
		id 'net.neoforged.moddev' version "${moddev_version}"
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
	kotlinController = false
	
	create(getRootProject()) {
		['1.21.1', '1.21.11', '26.2', '26.3'].each { mc ->
			['fabric', 'neoforge'].each { loader ->
				versions([("${mc}-${loader}".toString()): mc]).buildscript("build.${loader}.gradle".toString())
			}
		}
		vcsVersion = '1.21.1-neoforge'
	}
}

rootProject.name = 'collision-lag-fix'
