modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/traelmyx/collision-lag-fix/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "traelmyx"
${logo_key} = "assets/collision_lag_fix/icon.png"
displayTest = "IGNORE_ALL_VERSION"
description = '''Fast entities (TNT from cannons, launched items, anything moving many blocks per tick) no longer make the server check every block in a huge box around their path. Fixes MC-260743.'''

[[mixins]]
config = "collision_lag_fix.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_dep}"
ordering = "NONE"
side = "BOTH"
