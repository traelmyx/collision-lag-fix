name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: server ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [1.21.1-fabric, 1.21.11-fabric, 26.2-fabric, 26.3-fabric, 1.21.1-neoforge, 1.21.11-neoforge, 26.2-neoforge, 26.3-neoforge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and run server GameTests
        run: ./gradlew --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 :${{ matrix.node }}:build
      - name: Server GameTests in a production launch (Fabric)
        # Fabric API's @GameTest cannot be read in a production run on 1.21.11; the dev run above covers it
        if: endsWith(matrix.node, '-fabric') && matrix.node != '1.21.11-fabric'
        run: ./gradlew --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 :${{ matrix.node }}:runProductionGameTest
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/libs/
            versions/${{ matrix.node }}/build/gametest-report.xml
            versions/${{ matrix.node }}/build/run/gameTest/logs/
            versions/${{ matrix.node }}/build/run/gameTest/crash-reports/
            versions/${{ matrix.node }}/build/run/prodGameTest/logs/
          if-no-files-found: ignore

  client:
    name: client ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [1.21.1-fabric, 1.21.11-fabric, 26.2-fabric, 26.3-fabric, 1.21.1-neoforge, 1.21.11-neoforge, 26.2-neoforge, 26.3-neoforge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: Client gametest
        run: |
          args="--stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 :${{ matrix.node }}:runProductionClientGameTest"
          case "${{ matrix.node }}" in
            *-neoforge) xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew $args ;;
            *) ./gradlew $args ;;
          esac
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/run/prodClientGameTest/screenshots/
            versions/${{ matrix.node }}/build/run/prodClientGameTest/logs/
            versions/${{ matrix.node }}/build/run/prodClientGameTest/crash-reports/
            versions/${{ matrix.node }}/build/run/clientSmoke/screenshots/
            versions/${{ matrix.node }}/build/run/clientSmoke/logs/
            versions/${{ matrix.node }}/build/run/clientSmoke/crash-reports/
          if-no-files-found: ignore

  lithium:
    name: server 1.21.1-fabric with Lithium
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 -PwithLithium :1.21.1-fabric:runGameTest
      - if: always()
        run: grep -h "collision_lag_fix\]\|lithium" versions/1.21.1-fabric/build/run/gameTest/logs/latest.log | head -20 || true
